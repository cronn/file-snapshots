name: Setup

inputs:
  cache:
    description: Whether to cache the pnpm store. Disable in privileged jobs to prevent cache poisoning.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm and Node.js
      uses: pnpm/setup@v1.0.0
      with:
        install: false
        cache: ${{ inputs.cache }}

    - name: Install dependencies
      run: pnpm clean-install
      shell: bash
