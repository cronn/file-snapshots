includeWorkspaceRoot: true
saveExact: true
catalogPrune: true
dedupePeers: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 40320 # 4 weeks

packages:
  - packages/*

catalog:
  "@arethetypeswrong/core": 0.18.5
  "@changesets/cli": 3.0.0
  "@npm/types": 2.1.0
  "@playwright/test": 1.62.1
  "@pnpm/meta-updater": 2.0.6
  "@types/node": 24.13.3
  "@typescript/native": "npm:typescript@^7.0.2"
  "@vitest/coverage-v8": 4.1.10
  "@vitest/expect": 4.1.10
  "eslint": 10.8.1
  "eslint-config-prettier": 10.1.8
  "eslint-plugin-check-file": 3.3.2
  "eslint-plugin-unused-imports": 4.4.1
  "knip": 6.32.1
  "markdown-table": 3.0.4
  "oxc-minify": 0.143.0
  "oxfmt": 0.62.0
  "package-directory": 8.2.0
  "publint": 0.3.23
  "rimraf": 6.1.3
  "tsdown": 0.22.14
  "turbo": 2.10.9
  "typescript": "npm:@typescript/typescript6@^6.0.2"
  "typescript-eslint": 8.66.0
  "vitepress": 2.0.0-alpha.19
  "vitepress-plugin-group-icons": 1.7.6
  "vitest": 4.1.10
  "yaml": 2.9.0

overrides:
  adm-zip@<0.6.0: ^0.6.0
  brace-expansion@<=5.0.7: ^5.0.8
  cross-spawn@<7.0.5: ^7.0.5
  esbuild@<0.25.0: ^0.25.0
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
  uuid@<11.1.1: ^11.1.1
  vite@<8.0.5: ^8.0.5

allowBuilds:
  esbuild: false
  node: true
  node@runtime:24.19.0: true

minimumReleaseAgeExclude:
  - uuid@11.1.1
  - adm-zip@0.6.0
  - tar@7.5.21
  - "@changesets/apply-release-plan@8.0.0"
  - "@changesets/assemble-release-plan@7.0.0"
  - "@changesets/changelog-git@1.0.0"
  - "@changesets/cli@3.0.0"
  - "@changesets/config@4.0.0"
  - "@changesets/errors@1.0.0"
  - "@changesets/get-dependents-graph@3.0.0"
  - "@changesets/git@4.0.0"
  - "@changesets/parse@1.0.0"
  - "@changesets/pre@3.0.0"
  - "@changesets/read@1.0.0"
  - "@changesets/should-skip-package@1.0.0"
  - "@changesets/types@7.0.0"
  - "@changesets/write@1.0.0"

trustPolicyExclude:
  - "@pnpm/worker@1000.6.11"
  - "@pnpm/symlink-dependency@1000.0.20"
